# Explicit opt-in for the experimental staged OTA recovery pair.
CONFIG_VIMAR_OTA_INSTALLER=y
CONFIG_NRF_COMPRESS=y
CONFIG_NRF_COMPRESS_DECOMPRESSION=y
CONFIG_NRF_COMPRESS_LZMA=y
CONFIG_NRF_COMPRESS_LZMA_VERSION_LZMA2=y
CONFIG_NRF_COMPRESS_ARM_THUMB=y
CONFIG_NRF_COMPRESS_LZMA_MAX_DICT_SIZE=32768
CONFIG_NRF_COMPRESS_LZMA_MAX_LC_LP=3
CONFIG_NRF_COMPRESS_LZMA_LP=0
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_MAIN_STACK_SIZE=8192

CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y

# SDK Oberon gates public ECC import on the key-pair import dispatcher.
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
