# The nRF52840 cannot retain two equal MCUboot slots with the current Zigbee,
# Bluetooth, and MCUmgr images. This DK-only profile exercises the Zigbee
# endpoint and state model while the base profile remains the validated BLE
# recovery/FOTA image.
CONFIG_BT=n
CONFIG_MCUMGR=n

# The DK UART device is not passed through by every development container.
# RTT keeps diagnostic logs observable over the already-connected J-Link.
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n

# Scan the standard 2.4 GHz Zigbee channel set. Nordic's default single-channel
# profile uses channel 16, while third-party coordinators can use any channel.
CONFIG_ZIGBEE_CHANNEL_SELECTION_MODE_MULTI=y
