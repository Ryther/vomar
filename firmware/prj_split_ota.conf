# Split OTA main: production logging disabled; BLE lives in independent recovery.
CONFIG_LOG=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_LOG_BACKEND_RTT=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_FLASH=y
CONFIG_DISABLE_FLASH_PATCH=y
CONFIG_FLASH_MAP=y
CONFIG_SETTINGS=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_BT=n
CONFIG_MCUMGR=n
CONFIG_ZIGBEE_ADD_ON=y
CONFIG_ZIGBEE_APP_UTILS=y
CONFIG_ZIGBEE_ROLE_ROUTER=y
CONFIG_ZIGBEE_CHANNEL_SELECTION_MODE_MULTI=y
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_MAIN_THREAD_PRIORITY=7
# Startup verifies the signed recovery/loader using the PSA crypto backend.
# Its nested calls overflowed the legacy2KiB main stack on the standalone DK.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4608

CONFIG_CBPRINTF_FP_SUPPORT=n
CONFIG_SIZE_OPTIMIZATIONS_AGGRESSIVE=y
CONFIG_VIMAR_P031_PROTECTION=y
CONFIG_VIMAR_OTA_SPLIT_STAGING=y
