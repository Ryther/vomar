[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vomar-updater"
version = "1.0.0"
description = "Vomar signed firmware updater and device management"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = ["bleak==3.0.2", "cbor2==6.1.5", "cryptography==50.0.2", "intelhex==2.3.0", "platformdirs==4.13.5", "keyring==25.7.0", "paho-mqtt==2.1.0", "pyelftools==0.32"]

[project.optional-dependencies]
gui = ["PySide6-Essentials==6.12.0"]
package = ["PyInstaller==6.22.3"]

[project.scripts]
vomar = "vomar_updater.cli:main"

[project.gui-scripts]
vomar-gui = "vomar_updater.gui.app:main"

[tool.setuptools]
packages = ["vomar_updater", "vomar_updater.core", "vomar_updater.adapters", "vomar_updater.gui", "tools", "tools.firmware", "tools.release"]
package-dir = {vomar_updater = "apps/desktop-updater/src/vomar_updater", tools = "tools", "tools.firmware" = "tools/firmware", "tools.release" = "tools/release"}

[tool.setuptools.package-data]
vomar_updater = ["resources/*"]

[tool.pytest.ini_options]
pythonpath = [".", "apps/desktop-updater/src"]
testpaths = ["apps/desktop-updater/tests", "tools/release/tests", "tools/dev/tests"]
