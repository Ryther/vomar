version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /.devcontainer/assistants
    schedule: {interval: weekly}
    groups:
      assistant-tools: {patterns: ['*']}
  - package-ecosystem: gradle
    directory: /apps/android-updater
    schedule: {interval: weekly}
    groups:
      kotlin-android: {patterns: ['org.jetbrains.kotlin*', 'com.android*']}
