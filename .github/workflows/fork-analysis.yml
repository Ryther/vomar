name: Local contributor analysis
on:
  pull_request:
permissions: {contents: read}
jobs:
  local:
    if: github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]'
    name: Sonar contributor capabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.event.pull_request.base.sha }}', path: trusted, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.event.pull_request.head.sha }}', path: candidate, persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.13.12'}
      - run: mkdir -p reports && PYTHONPATH=trusted python -m tools.release.sonar_local --candidate candidate --reports reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: local-sonar-capabilities, path: reports, if-no-files-found: error}
