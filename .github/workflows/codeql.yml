name: CodeQL
on:
  push: {branches: [main]}
  pull_request:
  schedule: [{cron: '19 4 * * 1'}]
  workflow_dispatch:
permissions: {contents: read, actions: read, security-events: write}
jobs:
  interpreted:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {language: python, mode: none}
          - {language: javascript-typescript, mode: none}
          - {language: actions, mode: none}
          - {language: java-kotlin, mode: manual}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with: {languages: '${{ matrix.language }}', build-mode: '${{ matrix.mode }}', tools: linked, config-file: .github/codeql-config.yml}
      - if: matrix.language == 'java-kotlin'
        run: apps/android-updater/gradlew -p apps/android-updater --dependency-verification=strict --no-build-cache --rerun-tasks :core:compileKotlin :app:compileDebugKotlin
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with: {category: '/language:${{ matrix.language }}'}
  native:
    name: CodeQL firmware C
    env:
      VIMAR_NCS_WORKSPACE: /home/runner/.cache/vomar/ncs
      VIMAR_WEST: /home/runner/.cache/vomar/ncs-venv/bin/west
      VIMAR_BUILD_PYTHON: /home/runner/.cache/vomar/ncs-venv/bin/python
      ZEPHYR_SDK_INSTALL_DIR: /home/runner/.cache/vomar/zephyr-sdk-1.0.1
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.13.12'}
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gperf device-tree-compiler
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python tools/dev/bootstrap.py firmware
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with: {languages: c-cpp, build-mode: manual, tools: linked, db-location: '${{ runner.temp }}/vomar-codeql-db', config-file: .github/codeql-config.yml}
      - env:
          VIMAR_NCS_WORKSPACE: /home/runner/.cache/vomar/ncs
          VIMAR_WEST: /home/runner/.cache/vomar/ncs-venv/bin/west
          ZEPHYR_SDK_INSTALL_DIR: /home/runner/.cache/vomar/zephyr-sdk-1.0.1
        run: python -m tools.release.ci_firmware --output _test/codeql-firmware
      - run: python -m pytest tools/firmware/tests -q
      - run: python -m tools.release.capture_analysis --build _test/codeql-firmware --output _test/codeql-reports
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with: {category: /language:c-cpp, upload: never, output: _test/codeql-sarif}
      - run: python -m tools.release.codeql_scope --archive "${{ runner.temp }}/vomar-codeql-db/cpp/src.zip" --reports _test/codeql-reports --sarif _test/codeql-sarif
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with: {sarif_file: _test/codeql-sarif, category: /language:c-cpp}
  required:
    name: CodeQL required
    needs: [interpreted, native]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env: {INTERPRETED: '${{ needs.interpreted.result }}', NATIVE: '${{ needs.native.result }}'}
        run: test "$INTERPRETED" = success && test "$NATIVE" = success
