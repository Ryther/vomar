name: Validate candidate
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      sha: {type: string, required: true}
permissions: {contents: read}
concurrency:
  group: validation-${{ github.ref }}-${{ inputs.sha || github.sha }}
  cancel-in-progress: false
jobs:
  source:
    name: Contracts required
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ inputs.sha || github.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.13.12'}
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-desktop.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m tools.release.component_versions --output reports/component-versions.json
      - run: python -m tools.release.public_tree
      - run: python -m coverage run --source=. -m pytest tools/release/tests tools/dev/tests apps/desktop-updater/tests --ignore=apps/desktop-updater/tests/test_gui.py
      - run: mkdir -p reports && python -m coverage xml -o reports/python-coverage.xml
      - run: python -m tools.release.prepare_pr_analysis --python-coverage reports/python-coverage.xml --repository .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: 'python-reports-${{ inputs.sha || github.sha }}', path: reports, if-no-files-found: error}
  devcontainer:
    name: Devcontainer required
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ inputs.sha || github.sha }}', persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24.22.1'}
      - run: npm ci --prefix .devcontainer/assistants --omit=dev --ignore-scripts
      - name: Build and reopen the single development configuration
        run: .devcontainer/assistants/node_modules/.bin/devcontainer up --workspace-folder .
      - name: Check the mounted daemon and bundled tools inside the container
        run: |
          .devcontainer/assistants/node_modules/.bin/devcontainer exec --workspace-folder . python tools/dev/container_check.py
          .devcontainer/assistants/node_modules/.bin/devcontainer exec --workspace-folder . python -c 'from pathlib import Path; from tempfile import TemporaryFile; TemporaryFile(dir=Path.home()/".codex").close()'
          .devcontainer/assistants/node_modules/.bin/devcontainer exec --workspace-folder . codex --version
          .devcontainer/assistants/node_modules/.bin/devcontainer exec --workspace-folder . opencode --version
          .devcontainer/assistants/node_modules/.bin/devcontainer exec --workspace-folder . claude --version
          .devcontainer/assistants/node_modules/.bin/devcontainer exec --workspace-folder . devcontainer --version
          .devcontainer/assistants/node_modules/.bin/devcontainer exec --workspace-folder . /home/vscode/.cache/vomar/dev-venv/bin/python -m pytest tools/dev/tests -q
      - name: Remove only this job's development container
        if: always()
        run: docker ps -aq --filter "label=devcontainer.local_folder=$GITHUB_WORKSPACE" | xargs -r docker rm -f
  conventional:
    name: Conventional Commits
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ inputs.sha || github.sha }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.13.12'}
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Check title and actual commit range
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$PR_TITLE" ]; then cz check --message "$PR_TITLE"; fi
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ]; then cz check --rev-range "$BASE..HEAD"; else cz check --rev-range HEAD; fi
  firmware:
    name: Firmware required
    env:
      VIMAR_NCS_WORKSPACE: /home/runner/.cache/vomar/ncs
      VIMAR_WEST: /home/runner/.cache/vomar/ncs-venv/bin/west
      VIMAR_BUILD_PYTHON: /home/runner/.cache/vomar/ncs-venv/bin/python
      ZEPHYR_SDK_INSTALL_DIR: /home/runner/.cache/vomar/zephyr-sdk-1.0.1
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ inputs.sha || github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.13.12'}
      - name: Reserve disk capacity for all firmware profiles
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc
          df -h "$GITHUB_WORKSPACE"
          python - <<'PY'
          import os,shutil
          if shutil.disk_usage(os.environ['GITHUB_WORKSPACE']).free < 30 * 1024**3:
              raise SystemExit('At least 30 GiB free is required before NCS setup')
          PY
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gperf device-tree-compiler binutils-arm-none-eabi
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python tools/dev/bootstrap.py firmware
      - run: python -m tools.release.c_coverage --output reports
      - name: Compile real DK profiles with an ephemeral development identity
        env:
          VIMAR_NCS_WORKSPACE: /home/runner/.cache/vomar/ncs
          VIMAR_WEST: /home/runner/.cache/vomar/ncs-venv/bin/west
          ZEPHYR_SDK_INSTALL_DIR: /home/runner/.cache/vomar/zephyr-sdk-1.0.1
        run: python -m tools.release.ci_firmware --output _test/ci-firmware
      - run: python -m tools.release.capture_analysis --build _test/ci-firmware --output reports
      - run: python -m tools.release.inventory firmware --output reports/firmware-sdk.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: 'firmware-reports-${{ inputs.sha || github.sha }}', path: reports, if-no-files-found: error}
  android:
    name: Android required
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ inputs.sha || github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.13.12'}
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: apps/android-updater/gradlew -p apps/android-updater --dependency-verification=strict :core:test :core:jacocoTestReport :app:testDebugUnitTest :app:lint :app:assembleRelease :app:writeRuntimeInventory
      - name: Enable the disposable emulator's KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise synthetic Android UI and collect device coverage
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          avd-name: vomar-ci
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: >-
            apps/android-updater/gradlew -p apps/android-updater --dependency-verification=strict
            :app:connectedDebugAndroidTest
            -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true
            -Pandroid.testInstrumentationRunnerArguments.class=org.openvimar.updater.InitialInstallUiTest,org.openvimar.updater.InitialInstallAndroidAdapterTest ||
            { mkdir -p _test/android-ui-diagnostics;
            adb -s emulator-5554 shell dumpsys window > _test/android-ui-diagnostics/window.txt;
            adb -s emulator-5554 shell dumpsys power > _test/android-ui-diagnostics/power.txt;
            adb -s emulator-5554 logcat -d -t 500 > _test/android-ui-diagnostics/logcat.txt;
            adb -s emulator-5554 exec-out screencap -p > _test/android-ui-diagnostics/screen.png;
            adb -s emulator-5554 pull /sdcard/Android/data/org.openvimar.updater/files/ui-failure _test/android-ui-diagnostics || true;
            exit 1; };
            apps/android-updater/gradlew -p apps/android-updater --dependency-verification=strict :app:jacocoDebugReport
      - name: Retain synthetic Android test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-test-diagnostics-${{ inputs.sha || github.sha }}
          path: |
            apps/android-updater/app/build/reports/androidTests
            apps/android-updater/app/build/outputs/androidTest-results
            _test/android-ui-diagnostics
          if-no-files-found: ignore
      - name: Collect actual JVM and synthetic device coverage
        run: |
          mkdir -p reports
          cp apps/android-updater/app/build/reports/dependencies/android-runtime.json reports/android-runtime.json
          cp apps/android-updater/core/build/reports/jacoco/test/jacocoTestReport.xml reports/core-jacoco.xml
          cp apps/android-updater/app/build/reports/jacoco/jacocoDebugReport/jacocoDebugReport.xml reports/app-jacoco.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: 'android-reports-${{ inputs.sha || github.sha }}', path: reports, if-no-files-found: error}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: 'android-unsigned-${{ inputs.sha || github.sha }}', path: apps/android-updater/app/build/outputs/apk/release/app-release-unsigned.apk, if-no-files-found: error}
  desktop:
    name: Desktop native (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, platform: linux-x64}
          - {runner: windows-2022, platform: windows-x64}
          - {runner: macos-15, platform: macos-arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ inputs.sha || github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.13.12'}
      - name: Install Linux GUI runtime before tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-0 libdbus-1-3 libfontconfig1 fonts-dejavu-core libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0
      - run: python -m pip install --require-hashes -r requirements-desktop.lock
      - run: python -m pip install --no-deps .
      - name: GUI and core tests
        env: {QT_QPA_PLATFORM: offscreen}
        run: python -m pip install --require-hashes -r requirements-dev.lock && python -m pytest apps/desktop-updater/tests
      - run: python -m pip install --require-hashes -r requirements-security.lock
      - run: pip-audit --disable-pip --no-deps -r requirements-desktop.lock -f json -o native-dependency-audit.json
      - run: python -m tools.release.package_desktop --output _test/native
      - name: Audit the actual frozen package dependency inventory
        run: python -m tools.release.inventory audit --input _test/native/native-${{ matrix.platform }}.json --output _test/native/advisories-${{ matrix.platform }}.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: 'desktop-${{ matrix.platform }}-${{ inputs.sha || github.sha }}', path: '_test/native/vomar-desktop-*', if-no-files-found: error}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-evidence-${{ matrix.platform }}-${{ inputs.sha || github.sha }}
          path: |
            _test/native/native-*.json
            _test/native/package-report-*.json
            _test/native/advisories-*.json
          if-no-files-found: error
  desktop-required:
    name: Desktop required
    needs: desktop
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env: {RESULT: '${{ needs.desktop.result }}'}
        run: test "$RESULT" = success
  documentation:
    name: Documentation required
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ inputs.sha || github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.13.12'}
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: mkdocs build --strict
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: 'documentation-${{ inputs.sha || github.sha }}', path: _test/site, if-no-files-found: error}
  converter:
    name: Converter required
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ inputs.sha || github.sha }}', persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24.22.1'}
      - run: mkdir -p reports && node --test --experimental-test-coverage --test-reporter=lcov --test-reporter-destination=reports/lcov.info integrations/zigbee2mqtt/test/*.test.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: 'javascript-reports-${{ inputs.sha || github.sha }}', path: reports, if-no-files-found: error}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: 'converter-${{ inputs.sha || github.sha }}', path: integrations/zigbee2mqtt/dist/vimar_30805.js, if-no-files-found: error}

  sonar-pr:
    needs: [source, android, converter]
    if: always() && github.event_name == 'pull_request'
    uses: ./.github/workflows/sonar-pr.yml
    with:
      sha: ${{ inputs.sha || github.sha }}
      coverage-result: ${{ needs.source.result == 'success' && needs.android.result == 'success' && needs.converter.result == 'success' && 'success' || 'failure' }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
